<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход / Регистрация</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button.reg { background: #4CAF50; }
        .alert { color: red; margin-bottom: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h2 style="text-align: center;">Вход</h2>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="action" value="login">
        <input type="text" name="login" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <h3 style="text-align: center; font-size: 16px;">Или регистрация</h3>
    <form method="POST">
        <input type="hidden" name="action" value="register">
        <input type="text" name="login" placeholder="Новый логин" required>
        <input type="password" name="password" placeholder="Новый пароль" required>
        <button type="submit" class="reg">Создать аккаунт</button>
    </form>
</div>
</body>
</html>
