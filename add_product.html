<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить товар</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
        input, select { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <a href="/">← Назад в каталог</a>
    <h2>Новый товар</h2>
    <form method="POST">
        <input type="text" name="model" placeholder="Модель" required>
        <input type="number" step="0.01" name="price" placeholder="Цена" required>
        <input type="number" name="warranty" placeholder="Гарантия (мес)" required>

        <select name="category_id" required>
            <option value="">Выберите категорию</option>
            {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>

        <select name="manufacturer_id" required>
            <option value="">Выберите бренд</option>
            {% for m in manufacturers %}
            <option value="{{ m.id }}">{{ m.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Сохранить</button>
    </form>
</div>
</body>
</html>
